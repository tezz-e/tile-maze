name: Build & Release Tiltmaze

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web-and-server:
    name: Build & Test Web Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Game & Server
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Run Automated Test Suite
        run: npm --workspace=game test

  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x app/gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug
        working-directory: app

      - name: Rename & Stage APK Asset
        run: |
          mkdir -p release-assets
          cp app/app/build/outputs/apk/debug/app-debug.apk release-assets/Tiltmaze-Controller.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tiltmaze-Controller-APK
          path: release-assets/Tiltmaze-Controller.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [web-and-server, android-apk]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built APK
        uses: actions/download-artifact@v4
        with:
          name: Tiltmaze-Controller-APK
          path: release-assets

      - name: Update Floating Release Tag
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest ${{ github.sha }}
          git push origin latest --force

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Tiltmaze Controller APK' }}
          files: release-assets/Tiltmaze-Controller.apk
          generate_release_notes: false
          body: |
            Automated production build for commit ${{ github.sha }}.
            
            ### Assets
            - **Tiltmaze-Controller.apk**: Android motion controller APK
            - **Source code (zip / tar.gz)**: Snapshot of current codebase
          make_latest: true
          draft: false
          prerelease: false
