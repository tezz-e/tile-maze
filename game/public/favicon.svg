<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="60%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#030304" />
    </radialGradient>

    <!-- Chrome Sphere Gradient -->
    <radialGradient id="chromeBall" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="55%" stop-color="#94a3b8" />
      <stop offset="85%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Chrome Specular Glow -->
    <radialGradient id="specularGlow" cx="30%" cy="28%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for Marble -->
    <radialGradient id="ballShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Cyan Goal Pulse -->
    <radialGradient id="cyanPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#00f5ff" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Red Kinetic Accent -->
    <linearGradient id="kineticRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4438" />
      <stop offset="100%" stop-color="#ea3323" />
    </linearGradient>

    <!-- Border Sheen -->
    <linearGradient id="borderSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderSheen)" stroke-width="6" />

  <!-- Outer Concentric Maze Groove Ring -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="#27272a" stroke-width="12" stroke-linecap="round" />
  <circle cx="256" cy="256" r="184" fill="none" stroke="#3f3f46" stroke-width="4" stroke-dasharray="8 14" opacity="0.6" />

  <!-- Middle Concentric Maze Track (Broken Arc) -->
  <path d="M 136 256 A 120 120 0 1 1 376 256" fill="none" stroke="#27272a" stroke-width="16" stroke-linecap="round" />
  <path d="M 136 256 A 120 120 0 0 1 256 136" fill="none" stroke="url(#kineticRed)" stroke-width="16" stroke-linecap="round" />

  <!-- Inner Precision Spiral Guide -->
  <path d="M 256 196 A 60 60 0 1 1 196 256" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.85" />

  <!-- Kinetic 18° Tilt Tangent Vector (Skyway Rail) -->
  <line x1="120" y1="360" x2="380" y2="280" stroke="url(#kineticRed)" stroke-width="10" stroke-linecap="round" />
  <!-- Micro Rail Grip Ticks -->
  <circle cx="150" cy="351" r="3" fill="#ffffff" opacity="0.8" />
  <circle cx="200" cy="335" r="3" fill="#ffffff" opacity="0.8" />
  <circle cx="300" cy="305" r="3" fill="#ffffff" opacity="0.8" />
  <circle cx="350" cy="289" r="3" fill="#ffffff" opacity="0.8" />

  <!-- Goal Energy Beacon Node (Top Right) -->
  <circle cx="376" cy="180" r="28" fill="url(#cyanPulse)" />
  <circle cx="376" cy="180" r="10" fill="#00f5ff" />
  <circle cx="376" cy="180" r="4" fill="#ffffff" />

  <!-- Ball Drop Shadow -->
  <ellipse cx="256" cy="290" rx="46" ry="18" fill="url(#ballShadow)" />

  <!-- Center Chrome Marble -->
  <circle cx="256" cy="260" r="44" fill="url(#chromeBall)" stroke="#475569" stroke-width="2" />
  <!-- Specular Reflection Highlight -->
  <circle cx="242" cy="246" r="26" fill="url(#specularGlow)" />
  <circle cx="236" cy="240" r="6" fill="#ffffff" />

  <!-- Telemetry Dot Matrix Signature (Top Left & Bottom Right) -->
  <circle cx="76" cy="76" r="4" fill="#71717a" opacity="0.7" />
  <circle cx="94" cy="76" r="4" fill="#71717a" opacity="0.7" />
  <circle cx="112" cy="76" r="4" fill="#ea3323" />
  <circle cx="76" cy="94" r="4" fill="#71717a" opacity="0.4" />
  <circle cx="94" cy="94" r="4" fill="#71717a" opacity="0.7" />
  <circle cx="112" cy="94" r="4" fill="#71717a" opacity="0.4" />

  <!-- Bottom Right Minimal Coordinates -->
  <text x="436" y="440" font-family="monospace" font-size="16" font-weight="700" fill="#71717a" text-anchor="end" letter-spacing="2">TLTMZ // 60HZ</text>
</svg>
