<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Tiltmaze: Kinetic Edition - 3D Motion Marble Labyrinth</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --background: #000000;
        --foreground: #ffffff;
        --muted: #111111;
        --muted-border: #222222;
        --muted-foreground: #888888;
        --accent: #EA3323; /* Nothing / Odyssey Red */
        --font-mono: 'Space Mono', monospace;
        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--background);
        font-family: var(--font-mono);
        color: var(--foreground);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #game-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
      #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        pointer-events: none;
      }
      .interactive {
        pointer-events: auto;
      }
      button {
        all: unset;
        cursor: pointer;
        box-sizing: border-box;
        font-family: var(--font-mono);
      }
      #level-fade-curtain {
        position: fixed;
        inset: 0;
        background: #000000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s ease-in-out;
        z-index: 999;
      }
      #level-fade-curtain.fade-active {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="level-fade-curtain"></div>
    <div id="game-container"></div>
    <div id="ui-layer"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
